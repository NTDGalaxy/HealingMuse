name: HealingMuse validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-shell.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run b2:test:preflight
      - run: npm run db:test
      - run: npm run db:test:catalog
      - run: npm run db:test:release
      - run: npm run db:test:b2
      - run: npm run security:repository
      - run: npm run build
        env:
          # A production-shaped bundle for the budgets; nothing contacts this host.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run budgets
      - run: npm run security:client
      - run: node scripts/test-fixtures.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
